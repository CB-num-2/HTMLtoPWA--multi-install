<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My PWA #1</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="font-family: sans-serif; padding: 2rem;">
  <h1>My PWA #1</h1>
  <button id="installBtn" hidden style="padding: 12px 20px; font-size: 16px; cursor: pointer;">
    Install PWA #1
  </button>
  <p><a href="../app2/">Go to PWA #2</a></p>

  <script>
    // 1. Register the service worker scoped specifically to /app1/
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js', { scope: './' });
    }

    // 2. Capture Chrome's install prompt and wire up the button
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false; // Show the button once ready
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
    });
  </script>
</body>
</html>
