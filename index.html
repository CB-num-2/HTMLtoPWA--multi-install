<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-PWA Example</title>

  <script>
    // 1. Read the '?app=' parameter from the URL (defaults to '1' if missing)
    const params = new URLSearchParams(window.location.search);
    const appId = params.get('app') || '1';

    // 2. Build a unique manifest for this specific parameter
    const manifest = {
      name: `My PWA #${appId}`,
      short_name: `PWA #${appId}`,
      id: `${window.location.pathname}?app=${appId}`,
      start_url: `${window.location.pathname}?app=${appId}`,
      display: 'standalone',
      background_color: '#ffffff',
      theme_color: appId === '1' ? '#2563eb' : '#16a34a',
      icons: [
        {
          // Inline SVG icon so you don't need external image files to test
          src: `data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 192 192"><rect width="192" height="192" fill="${appId === '1' ? '%232563eb' : '%2316a34a'}"/><text x="50%" y="54%" font-size="90" font-family="sans-serif" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">${appId}</text></svg>`,
          sizes: '192x192',
          type: 'image/svg+xml'
        }
      ]
    };

    // 3. Inject the manifest into the page before the browser parses it
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>
</head>
<body style="font-family: sans-serif; padding: 2rem;">

  <h1 id="heading">Loading...</h1>
  <p>Switch between instances using the links below, then click your browser's <strong>Install</strong> button for each one:</p>

  <ul>
    <li><a href="?app=1">Open PWA #1 (?app=1)</a></li>
    <li><a href="?app=2">Open PWA #2 (?app=2)</a></li>
  </ul>

  <script>
    // Update the page text so you can visually tell them apart
    document.getElementById('heading').textContent = `You are viewing PWA #${appId}`;
    document.title = `My PWA #${appId}`;
  </script>

</body>
</html>
